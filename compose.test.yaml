# Isolated disposable test database. No production volumes or credentials.
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mi_entreno_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_local_only
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mi_entreno_test"]
      interval: 2s
      timeout: 3s
      retries: 20
